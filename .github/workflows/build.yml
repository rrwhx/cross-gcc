name: Build Cross-GCC Toolchain

on:
  push:
    branches: [main, master]
    paths:
      - 'build-toolchain-generic.sh'
      - 'build-toolchain-elf.sh'
      - 'lib.sh'
      - 'prepare-gcc.sh'
      - 'install-prerequisites.sh'
      - 'get-latest-versions.sh'
      - 'test-toolchain.sh'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'build-toolchain-generic.sh'
      - 'build-toolchain-elf.sh'
      - 'lib.sh'
      - 'prepare-gcc.sh'
      - 'install-prerequisites.sh'
      - 'get-latest-versions.sh'
      - 'test-toolchain.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        include:
          - arch: riscv64
            libc: glibc
          - arch: loongarch64
            libc: glibc
          - arch: aarch64
            libc: glibc
          - arch: x86_64
            libc: glibc
          - arch: riscv32
            libc: glibc
          - arch: riscv64
            libc: musl

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          ./install-prerequisites.sh

      - name: Get latest versions
        id: versions
        run: |
          eval "$(./get-latest-versions.sh --shell)"
          echo "gcc_ver=$GCC_VER" >> $GITHUB_OUTPUT
          echo "binutils_ver=$BINUTILS_VER" >> $GITHUB_OUTPUT
          echo "glibc_ver=$GLIBC_VER" >> $GITHUB_OUTPUT
          echo "musl_ver=$MUSL_VER" >> $GITHUB_OUTPUT
          echo "linux_ver=$LINUX_VER" >> $GITHUB_OUTPUT

      - name: Compute target triple
        id: triple
        run: |
          if [ "${{ matrix.libc }}" = "musl" ]; then suf=musl; else suf=gnu; fi
          echo "target=${{ matrix.arch }}-linux-$suf" >> "$GITHUB_OUTPUT"

      # 发布产物会被下载到其他机器上运行，因此静态链接工具链自身的可执行文件，
      # 避免依赖 runner 的 glibc/libstdc++ 版本。显式给出 --install-dir，
      # 保持安装路径为 ./cross-<triple> (否则 --static 会追加 -static 后缀)。
      - name: Build toolchain
        run: |
          ./build-toolchain-generic.sh --arch ${{ matrix.arch }} --libc ${{ matrix.libc }} \
            --static --install-dir ./cross-${{ steps.triple.outputs.target }} --clean
        env:
          GCC_VER: ${{ steps.versions.outputs.gcc_ver }}
          BINUTILS_VER: ${{ steps.versions.outputs.binutils_ver }}
          GLIBC_VER: ${{ steps.versions.outputs.glibc_ver }}
          MUSL_VER: ${{ steps.versions.outputs.musl_ver }}
          LINUX_VER: ${{ steps.versions.outputs.linux_ver }}

      # 复用 lib.sh 的 verify_static_binaries，避免校验规则在 CI 与脚本中重复实现。
      # --require: 缺失即失败，防止路径变化导致校验被静默跳过。
      - name: Verify toolchain is statically linked
        env:
          TRIPLE: ${{ steps.triple.outputs.target }}
        run: |
          source ./lib.sh
          prefix="./cross-$TRIPLE"
          gcc_bin="$prefix/bin/$TRIPLE-gcc"
          [ -x "$gcc_bin" ] || error "工具链驱动缺失: $gcc_bin"
          libexec=$(dirname "$("$gcc_bin" -print-prog-name=cc1)")
          verify_static_binaries --require \
            "$prefix/bin/$TRIPLE-as" "$prefix/bin/$TRIPLE-ld" \
            "$prefix/bin/$TRIPLE-ar" "$prefix/bin/$TRIPLE-objdump" \
            "$gcc_bin" "$prefix/bin/$TRIPLE-g++" \
            "$prefix/bin/$TRIPLE-gfortran" \
            "$libexec/cc1" "$libexec/cc1plus" "$libexec/f951" \
            "$libexec/lto1" "$libexec/collect2"

      - name: Install qemu-user (for smoke test)
        run: |
          sudo apt-get install -y --no-install-recommends qemu-user qemu-user-static

      - name: Smoke test toolchain
        run: |
          ./test-toolchain.sh \
            --toolchain-dir ./cross-${{ steps.triple.outputs.target }} \
            --target ${{ steps.triple.outputs.target }} \
            --run-mode static

      - name: Package toolchain
        run: |
          tar -cJf cross-${{ steps.triple.outputs.target }}.tar.xz cross-${{ steps.triple.outputs.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch }}-${{ matrix.libc }}-toolchain
          path: cross-*.tar.xz
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Get latest versions
        id: versions
        run: |
          eval "$(./get-latest-versions.sh --shell)"
          echo "gcc_ver=$GCC_VER" >> $GITHUB_OUTPUT
          echo "binutils_ver=$BINUTILS_VER" >> $GITHUB_OUTPUT
          echo "glibc_ver=$GLIBC_VER" >> $GITHUB_OUTPUT
          echo "musl_ver=$MUSL_VER" >> $GITHUB_OUTPUT
          echo "linux_ver=$LINUX_VER" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: List files
        run: ls -lh artifacts/

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-toolchain
          name: "Latest Toolchain Build"
          body: |
            ## Cross-GCC Toolchain

            🔄 **Auto updated** by commit: ${{ github.sha }}
            📅 **Date**: ${{ github.event.head_commit.timestamp }}

            ## 组件版本
            | 组件 | 版本 |
            |------|------|
            | GCC | ${{ steps.versions.outputs.gcc_ver }} |
            | binutils | ${{ steps.versions.outputs.binutils_ver }} |
            | glibc | ${{ steps.versions.outputs.glibc_ver }} |
            | musl | ${{ steps.versions.outputs.musl_ver }} |
            | Linux 内核头文件 | ${{ steps.versions.outputs.linux_ver }} |

            ## 支持架构
            | Arch | LibC |
            |------|------|
            | riscv64 | glibc |
            | riscv64 | musl |
            | riscv32 | glibc |
            | loongarch64 | glibc |
            | aarch64 | glibc |
            | x86_64 | glibc |
          files: artifacts/*.tar.xz
          overwrite_files: true
          make_latest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

