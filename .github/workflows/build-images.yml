name: Build BusyBox & Kernel Images

on:
  push:
    branches: [main, master]
    paths:
      - 'build-busybox.sh'
      - 'build-kernel.sh'
      - 'lib.sh'
      - '.github/workflows/build-images.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-images:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            target: riscv64-linux-gnu
          - arch: aarch64
            target: aarch64-linux-gnu
          - arch: x86_64
            target: x86_64-linux-gnu
          - arch: loongarch64
            target: loongarch64-linux-gnu

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          ./install-prerequisites.sh

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v6
        with:
          path: cross-${{ matrix.target }}
          key: toolchain-${{ matrix.arch }}-${{ hashFiles('build-toolchain-generic.sh', 'lib.sh', 'prepare-gcc.sh') }}

      - name: Build toolchain (if not cached)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          ./build-toolchain-generic.sh \
            --arch ${{ matrix.arch }} --libc glibc --clean

      - name: Resolve build versions
        run: |
          # 内核：取 kernel.org 最新稳定发布版（仅拉取版本号 JSON，非执行远程脚本）
          LINUX_VER=$(curl -sSL --retry 3 https://www.kernel.org/releases.json | jq -r '.latest_stable.version')
          if [ -z "$LINUX_VER" ] || [ "$LINUX_VER" = "null" ]; then
            echo "::error::无法获取最新稳定内核版本" >&2
            exit 1
          fi
          # BusyBox：沿用脚本内置默认版本
          # 从单一事实来源读取, 不再用正则刮 shell 脚本 (格式一改就静默取到 unknown)
          BUSYBOX_VER=$(. ./versions.env >/dev/null 2>&1; echo "$BUSYBOX_VER")
          # 不再 fallback 成 unknown: 静默的 unknown 会让"版本取不到"这件事
          # 一路混进 release 说明而无人察觉 (build.yml 就是这么出的空版本表)
          [ -n "$BUSYBOX_VER" ] || { echo "::error::versions.env 中 BUSYBOX_VER 为空"; exit 1; }
          echo "LINUX_VER=$LINUX_VER" >> "$GITHUB_ENV"
          echo "BUSYBOX_VER=$BUSYBOX_VER" >> "$GITHUB_ENV"
          echo "内核最新稳定版: $LINUX_VER"
          echo "BusyBox 版本: $BUSYBOX_VER"

      - name: Build BusyBox (with CoreMark)
        run: |
          ./build-busybox.sh \
            --arch ${{ matrix.arch }} --coremark \
            --cross-compile ./cross-${{ matrix.target }}/bin/${{ matrix.target }}-

      - name: Save BusyBox binary and clean
        run: |
          cp build-busybox-${{ matrix.arch }}/busybox busybox-${{ matrix.arch }}
          # coremark-${{ matrix.arch }} 已由脚本输出到工作目录, 无需复制
          rm -rf build-busybox-${{ matrix.arch }} logs-busybox-${{ matrix.arch }}

      - name: Build Linux Kernel
        run: |
          ./build-kernel.sh \
            --arch ${{ matrix.arch }} \
            --cross-compile ./cross-${{ matrix.target }}/bin/${{ matrix.target }}- \
            --linux-ver "$LINUX_VER" \
            --clean

      - name: List build artifacts
        run: |
          echo "=== BusyBox binary ==="
          ls -lh busybox-${{ matrix.arch }}
          file busybox-${{ matrix.arch }}
          echo "=== BusyBox initramfs ==="
          ls -lh initrd-${{ matrix.arch }}.cpio
          echo "=== CoreMark binary ==="
          ls -lh coremark-${{ matrix.arch }}
          file coremark-${{ matrix.arch }}
          echo "=== Kernel images ==="
          ls -lh kernel-${{ matrix.arch }}/

      - name: Upload BusyBox binary
        uses: actions/upload-artifact@v7
        with:
          name: busybox-${{ matrix.arch }}
          path: busybox-${{ matrix.arch }}
          retention-days: 7

      - name: Upload BusyBox initramfs
        uses: actions/upload-artifact@v7
        with:
          name: initrd-${{ matrix.arch }}
          path: initrd-${{ matrix.arch }}.cpio
          retention-days: 7

      - name: Upload CoreMark binary
        uses: actions/upload-artifact@v7
        with:
          name: coremark-${{ matrix.arch }}
          path: coremark-${{ matrix.arch }}
          retention-days: 7

      - name: Upload Kernel images
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ matrix.arch }}
          path: kernel-${{ matrix.arch }}/
          retention-days: 7

      - name: Save version info (once)
        if: matrix.arch == 'riscv64'
        run: |
          mkdir -p versioninfo
          printf 'KERNEL_VER=%s\nBUSYBOX_VER=%s\n' "$LINUX_VER" "$BUSYBOX_VER" > versioninfo/versions.txt
          cat versioninfo/versions.txt

      - name: Upload version info (once)
        if: matrix.arch == 'riscv64'
        uses: actions/upload-artifact@v7
        with:
          name: versions
          path: versioninfo/versions.txt
          retention-days: 7

  release:
    needs: build-images
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Load versions
        run: |
          f=artifacts/versions/versions.txt
          # 缺文件就失败, 不再填 unknown: 静默的 unknown 会让"版本没传过来"
          # 一路混进 release 说明而无人察觉
          [ -f "$f" ] || { echo "::error::缺少 $f, 无法确定构建使用的版本"; exit 1; }
          echo "::group::构建使用的版本"
          cat "$f"
          echo "::endgroup::"
          cat "$f" >> "$GITHUB_ENV"

      - name: Prepare release files
        run: |
          mkdir -p release
          # 版本说明文件（一并纳入 SHA256SUMS）
          {
            echo "Linux kernel : ${KERNEL_VER:-unknown} (最新稳定发布版)"
            echo "BusyBox      : ${BUSYBOX_VER:-unknown}"
            echo "CoreMark     : master (git 最新)"
            echo "Built (UTC)  : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > release/VERSIONS.txt
          ARCHES="riscv64 aarch64 x86_64 loongarch64"
          KIMGS="vmlinux Image Image.gz bzImage zImage config System.map"
          for arch in $ARCHES; do
            bundle="${arch}-boot"
            mkdir -p "$bundle"
            # BusyBox 二进制 -> <arch>-busybox（统一为“架构在前”）
            bb="artifacts/busybox-$arch/busybox-$arch"
            if [ -f "$bb" ]; then
              cp "$bb" "release/${arch}-busybox"
              cp "$bb" "$bundle/busybox"
            fi
            # initramfs -> <arch>-initrd.cpio
            ini="artifacts/initrd-$arch/initrd-$arch.cpio"
            if [ -f "$ini" ]; then
              cp "$ini" "release/${arch}-initrd.cpio"
              cp "$ini" "$bundle/initrd.cpio"
            fi
            # CoreMark 二进制 -> <arch>-coremark
            cm="artifacts/coremark-$arch/coremark-$arch"
            if [ -f "$cm" ]; then
              cp "$cm" "release/${arch}-coremark"
              cp "$cm" "$bundle/coremark"
            fi
            # 内核产物 (镜像/config/System.map): 仅进整包, 不发分立文件
            # (vmlinux 未压缩体积大, 且脱离 initrd 单独下载用途有限)
            kdir="artifacts/kernel-$arch"
            for img in $KIMGS; do
              if [ -f "$kdir/$img" ]; then
                cp "$kdir/$img" "$bundle/$img"
              fi
            done
            # 每架构整包 tar.gz（含同名顶层目录 <arch>-boot/，包内保留原始文件名）
            if [ -n "$(ls -A "$bundle" 2>/dev/null)" ]; then
              tar -czf "release/${arch}-boot.tar.gz" "$bundle"
            fi
            rm -rf "$bundle"
            # 内核单独包 <arch>-kernel.tar.gz（镜像 + config + System.map, 不含 initrd/busybox）
            kpkg="${arch}-kernel"
            mkdir -p "$kpkg"
            for img in $KIMGS; do
              if [ -f "$kdir/$img" ]; then
                cp "$kdir/$img" "$kpkg/$img"
              fi
            done
            if [ -n "$(ls -A "$kpkg" 2>/dev/null)" ]; then
              tar -czf "release/${kpkg}.tar.gz" "$kpkg"
            fi
            rm -rf "$kpkg"
          done
          # 生成所有文件的 SHA256 校验和
          ( cd release && rm -f SHA256SUMS.txt && sha256sum -- * > SHA256SUMS.txt )
          echo "=== Release files ==="
          ls -lh release/

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-images
          name: "Latest BusyBox & Kernel Images"
          body: |
            ## BusyBox & Kernel Images

            自动构建的 BusyBox initramfs 和 Linux 内核镜像。

            ### 构建版本
            | 组件 | 版本 |
            |------|------|
            | Linux Kernel | `${{ env.KERNEL_VER }}` (最新稳定发布版) |
            | BusyBox | `${{ env.BUSYBOX_VER }}` |
            | CoreMark | `master` (git 最新, initrd 内置 /root/coremark) |

            ### 产物说明（内核产物仅随整包发布；busybox/coremark/initrd 另提供分立文件）
            | 文件 | 说明 |
            |------|------|
            | `<arch>-boot.tar.gz` | 该架构整包（解压出 `<arch>-boot/` 目录）: 内核镜像 (vmlinux + Image/bzImage) + config + System.map + initrd.cpio + busybox + coremark |
            | `<arch>-kernel.tar.gz` | 内核单独包（解压出 `<arch>-kernel/` 目录）: 内核镜像 + config + System.map |
            | `<arch>-busybox` | BusyBox 静态链接二进制 |
            | `<arch>-coremark` | CoreMark 静态链接二进制 (git master) |
            | `<arch>-initrd.cpio` | BusyBox initramfs (cpio 格式, 内置 /root/coremark) |
            | `SHA256SUMS.txt` | 所有文件的 SHA256 校验和 |
            | `VERSIONS.txt` | 内核、BusyBox 与 CoreMark 版本及构建时间 |

            > 内核镜像、config 与 System.map 仅在 `<arch>-boot.tar.gz` / `<arch>-kernel.tar.gz` 包内提供（包内保留原始文件名）。

            ### 支持架构
            riscv64, aarch64, x86_64, loongarch64
          files: release/*
          overwrite_files: true
          make_latest: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
