name: Build Mini Kernel Images

on:
  push:
    branches: [main, master]
    paths:
      - 'build-kernel.sh'
      - 'build-busybox.sh'
      - 'lib.sh'
      - 'configs/kernel/**'
      - 'test/test-qemu-run.sh'
      - '.github/workflows/build-mini-kernel.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-mini-kernel:
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            cross: riscv64-linux-gnu-
            gcc_pkg: gcc-riscv64-linux-gnu
            libc_pkg: libc6-dev-riscv64-cross
            # ubuntu 26.04 起 riscv 从 qemu-system-misc 拆为独立包
            qemu_pkg: qemu-system-riscv
          - arch: aarch64
            cross: aarch64-linux-gnu-
            gcc_pkg: gcc-aarch64-linux-gnu
            libc_pkg: libc6-dev-arm64-cross
            qemu_pkg: qemu-system-arm
          - arch: x86_64
            cross: x86_64-linux-gnu-
            gcc_pkg: ''
            libc_pkg: ''
            qemu_pkg: qemu-system-x86
          - arch: loongarch64
            cross: loongarch64-linux-gnu-
            gcc_pkg: gcc-loongarch64-linux-gnu
            libc_pkg: libc6-dev-loong64-cross
            qemu_pkg: qemu-system-misc

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies (system compiler & qemu)
        run: |
          sudo apt-get update
          # libc6-dev-*-cross: 目标架构 libc 头文件与静态库 (busybox 静态链接必需,
          # --no-install-recommends 不会随 gcc-<arch>-linux-gnu 自动带入)
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc cpio bzip2 \
            libssl-dev libelf-dev jq curl \
            ${{ matrix.qemu_pkg }} ${{ matrix.gcc_pkg }} ${{ matrix.libc_pkg }}
          ${{ matrix.cross }}gcc --version | head -1
          # 存在性检查不可用 "cmd --version | head": 无 pipefail 时管道退出码取 head 的 0,
          # 会掩盖 command not found (riscv64 曾因此假阳性通过安装检查)
          QEMU_CHECK=$(command -v qemu-system-${{ matrix.arch }}) || { echo "::error::qemu-system-${{ matrix.arch }} 未安装成功 (检查 qemu_pkg 包名)"; exit 1; }
          "$QEMU_CHECK" --version | head -1
          # 预检: 目标 libc 可用且能静态链接, 提前暴露环境缺失
          printf 'int main(void){return 0;}\n' > /tmp/cc-test.c
          ${{ matrix.cross }}gcc -static /tmp/cc-test.c -o /tmp/cc-test
          echo "libc 预检通过"

      - name: Resolve versions
        run: |
          # 内核: kernel.org 最新稳定发布版 (仅拉取版本号 JSON)
          LINUX_VER=$(curl -sSL --retry 3 https://www.kernel.org/releases.json | jq -r '.latest_stable.version')
          if [ -z "$LINUX_VER" ] || [ "$LINUX_VER" = "null" ]; then
            echo "::error::无法获取最新稳定内核版本" >&2
            exit 1
          fi
          # BusyBox: 脚本内置默认版本
          BUSYBOX_VER=$(sed -n 's/^BUSYBOX_VER=.*:-\([0-9.]*\)}.*/\1/p' build-busybox.sh)
          echo "LINUX_VER=$LINUX_VER" >> "$GITHUB_ENV"
          echo "BUSYBOX_VER=${BUSYBOX_VER:-unknown}" >> "$GITHUB_ENV"
          echo "内核最新稳定版: $LINUX_VER, BusyBox: $BUSYBOX_VER"

      - name: Build BusyBox initramfs (system cross compiler, with CoreMark)
        run: |
          ./build-busybox.sh \
            --arch ${{ matrix.arch }} --coremark \
            --cross-compile ${{ matrix.cross }}
          # 保留 busybox 二进制用于打包, 再清理构建/日志目录
          # coremark-${{ matrix.arch }} 已由脚本输出到工作目录, 无需复制
          cp build-busybox-${{ matrix.arch }}/busybox busybox-${{ matrix.arch }}
          rm -rf build-busybox-${{ matrix.arch }} logs-busybox-${{ matrix.arch }}

      - name: Build mini kernel (--defconfig)
        run: |
          ./build-kernel.sh \
            --arch ${{ matrix.arch }} \
            --cross-compile ${{ matrix.cross }} \
            --linux-ver "$LINUX_VER" \
            --defconfig configs/kernel/${{ matrix.arch }}_qemu_virt_min_defconfig \
            --output kernel-min-${{ matrix.arch }} \
            --clean

      - name: Boot test with system QEMU
        run: |
          # 优先取本 workflow 安装的 apt 包内的 qemu-system 二进制;
          # runner 镜像可能预装了更旧的同名二进制抢占 PATH (不认新 CPU 型号),
          # 故 command -v 仅作回退, 并打印两者便于诊断
          PKG_BIN=$(dpkg -L ${{ matrix.qemu_pkg }} 2>/dev/null | grep -m1 "/qemu-system-${{ matrix.arch }}$" || true)
          PATH_BIN=$(command -v qemu-system-${{ matrix.arch }} || true)
          QEMU_BIN="${PKG_BIN:-$PATH_BIN}"
          echo "apt 包内二进制: ${PKG_BIN:-无}"
          echo "PATH 解析:     ${PATH_BIN:-无}"
          [ -n "$QEMU_BIN" ] || { echo "::error::未找到 qemu-system-${{ matrix.arch }}"; exit 1; }
          echo "选用 QEMU: $QEMU_BIN ($("$QEMU_BIN" --version | head -1))"
          mkdir -p images
          cp initrd-${{ matrix.arch }}.cpio images/
          for img in Image bzImage vmlinux; do
            if [ -f "kernel-min-${{ matrix.arch }}/$img" ]; then
              cp "kernel-min-${{ matrix.arch }}/$img" "images/${{ matrix.arch }}-$img"
            fi
          done
          ls -lh images/
          # --strict: 环境缺失导致的 SKIP 也视为失败, 防止假阳性绿
          ./test/test-qemu-run.sh --qemu-dir "$(dirname "$QEMU_BIN")" --images-dir ./images \
            --timeout 120 --verbose --strict ${{ matrix.arch }}

      - name: Package bundle (<arch>-boot-min.tar.gz)
        run: |
          # 仅发布整包: 包名带 -min 区分, 含同名顶层目录, 包内保留原始文件名
          top="${{ matrix.arch }}-boot-min"
          mkdir -p "$top" mini
          for img in Image Image.gz bzImage vmlinux config System.map; do
            if [ -f "kernel-min-${{ matrix.arch }}/$img" ]; then
              cp "kernel-min-${{ matrix.arch }}/$img" "$top/$img"
            fi
          done
          cp initrd-${{ matrix.arch }}.cpio "$top/initrd.cpio"
          cp busybox-${{ matrix.arch }} "$top/busybox"
          cp coremark-${{ matrix.arch }} "$top/coremark"
          # CoreMark 同时提供分立文件 <arch>-coremark (随 mini/ 上传并进入 release)
          cp coremark-${{ matrix.arch }} "mini/${{ matrix.arch }}-coremark"
          tar -czf "mini/${top}.tar.gz" "$top"
          rm -rf "$top"
          # 内核单独包 <arch>-kernel-min.tar.gz（镜像 + config + System.map, 不含 initrd/busybox）
          ktop="${{ matrix.arch }}-kernel-min"
          mkdir -p "$ktop"
          for img in Image Image.gz bzImage vmlinux config System.map; do
            if [ -f "kernel-min-${{ matrix.arch }}/$img" ]; then
              cp "kernel-min-${{ matrix.arch }}/$img" "$ktop/$img"
            fi
          done
          tar -czf "mini/${ktop}.tar.gz" "$ktop"
          rm -rf "$ktop"
          echo "=== 包内文件 ==="
          tar -tzf "mini/${{ matrix.arch }}-boot-min.tar.gz"
          tar -tzf "mini/${{ matrix.arch }}-kernel-min.tar.gz"
          ls -lh mini/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mini-kernel-${{ matrix.arch }}
          path: mini/
          retention-days: 7

      - name: Save version info (once)
        if: matrix.arch == 'riscv64'
        run: |
          mkdir -p versioninfo
          printf 'KERNEL_VER=%s\nBUSYBOX_VER=%s\n' "$LINUX_VER" "$BUSYBOX_VER" > versioninfo/versions.txt
          cat versioninfo/versions.txt

      - name: Upload version info (once)
        if: matrix.arch == 'riscv64'
        uses: actions/upload-artifact@v7
        with:
          name: mini-versions
          path: versioninfo/versions.txt
          retention-days: 7

  release:
    needs: build-mini-kernel
    runs-on: ubuntu-26.04
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Load versions
        run: |
          if [ -f artifacts/mini-versions/versions.txt ]; then
            cat artifacts/mini-versions/versions.txt >> "$GITHUB_ENV"
          else
            echo "KERNEL_VER=unknown" >> "$GITHUB_ENV"
            echo "BUSYBOX_VER=unknown" >> "$GITHUB_ENV"
          fi

      - name: Prepare release files
        run: |
          mkdir -p release
          {
            echo "Linux kernel : ${KERNEL_VER:-unknown} (最新稳定发布版, qemu-virt 最小配置)"
            echo "BusyBox      : ${BUSYBOX_VER:-unknown} (验证用 initramfs)"
            echo "CoreMark     : master (git 最新)"
            echo "Built (UTC)  : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > release/VERSIONS.txt
          cp artifacts/mini-kernel-*/* release/
          # 生成所有文件的 SHA256 校验和
          ( cd release && rm -f SHA256SUMS.txt && sha256sum -- * > SHA256SUMS.txt )
          echo "=== Release files ==="
          ls -lh release/

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-mini-kernels
          name: "Mini Kernel Images (qemu-virt)"
          body: |
            ## Mini Kernel Images (qemu-virt 最小配置)

            基于 `configs/kernel/<arch>_qemu_virt_min_defconfig` 构建的最小内核，
            使用 Ubuntu 系统交叉编译器构建，并已通过系统 QEMU 启动 + 关机验证（4 架构全覆盖）。

            ### 构建版本
            | 组件 | 版本 |
            |------|------|
            | Linux Kernel | `${{ env.KERNEL_VER }}` (最新稳定发布版) |
            | BusyBox | `${{ env.BUSYBOX_VER }}` (包内 initramfs 与静态二进制) |
            | CoreMark | `master` (git 最新, initrd 内置 /root/coremark) |

            ### 产物说明（内核/BusyBox 仅提供整包，包内为原始文件名；CoreMark 另提供分立文件）
            | 文件 | 说明 |
            |------|------|
            | `<arch>-boot-min.tar.gz` | 解压出 `<arch>-boot-min/` 目录: 内核镜像 (Image/bzImage/vmlinux 原名) + config + System.map + initrd.cpio + busybox + coremark |
            | `<arch>-kernel-min.tar.gz` | 内核单独包（解压出 `<arch>-kernel-min/` 目录）: 内核镜像 + config + System.map |
            | `<arch>-coremark` | CoreMark 静态链接二进制 (git master) |
            | `SHA256SUMS.txt` | 所有文件的 SHA256 校验和 |
            | `VERSIONS.txt` | 内核、BusyBox 与 CoreMark 版本及构建时间 |

            ### 启动示例 (更多见 test/test-qemu-run.sh)
            ```
            tar -xzf riscv64-boot-min.tar.gz && cd riscv64-boot-min
            qemu-system-riscv64 -M virt -nographic -m 1G -no-reboot -nic none \
              -kernel Image -initrd initrd.cpio \
              -append "console=ttyS0 rdinit=/sbin/poweroff -- -f"
            ```

            ### 支持架构
            riscv64, aarch64, x86_64, loongarch64
          files: release/*
          overwrite_files: true
          make_latest: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
